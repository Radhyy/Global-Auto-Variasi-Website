<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Global Auto Variasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Poppins", "sans-serif"],
              body: ["Plus Jakarta Sans", "sans-serif"]
            },
            colors: {
              primary: {
                50: "#fff5f2",
                100: "#ffe4dc",
                500: "#e62413",
                600: "#c91a0c",
                700: "#9c1309"
              },
              accent: {
                300: "#ffd36a",
                400: "#ffbd2e"
              },
              ink: {
                900: "#0f1115",
                800: "#171a21",
                700: "#252a33"
              }
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="font-body bg-slate-100 text-ink-800">
    <div class="flex min-h-screen items-center justify-center bg-gradient-to-r from-primary-700 via-primary-600 to-primary-500 px-4">
      <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
        <a href="index.html" class="mb-6 block text-center">
          <img src="LOGO/Logo.png" alt="Global Auto Variasi" class="mx-auto h-16" />
        </a>
        <h2 class="mb-1 text-center text-2xl font-bold text-ink-900">Selamat Datang Kembali</h2>
        <p class="mb-6 text-center text-sm text-slate-600">Silakan masuk untuk melanjutkan.</p>
        <form action="/dashboard/dashboard.html">
          <div class="grid gap-4">
            <div>
              <label for="email" class="text-sm font-medium text-slate-700">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                value="admin@globalauto.com"
                class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-primary-500 focus:ring focus:ring-primary-500/50"
              />
            </div>
            <div>
              <label for="password" class="text-sm font-medium text-slate-700">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                value="password123"
                class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-primary-500 focus:ring focus:ring-primary-500/50"
              />
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center">
                <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
                <label for="remember-me" class="ml-2 block text-sm text-slate-900">Ingat saya</label>
              </div>
              <div class="text-sm">
                <a href="#" class="font-medium text-primary-600 hover:text-primary-500">Lupa password?</a>
              </div>
            </div>
            <div>
              <button type="submit" class="w-full rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
                Login
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
